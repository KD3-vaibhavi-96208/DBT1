<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="Dom.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
       <h1>Student Information </h1>
    <div class="container">
    <div>
    <label class="form-label">roll no </label>
    <input type="number" id="inputRollno" class="form-control">
    </div>
    <div>
    <label class="form-label">name</label>
    <input type="text" id="inputName" class="form-control">
    </div>
    <div>
    <label class="form-label">marks</label>
    <input type="number" id="inputMarks" class="form-control">
    </div>
    <div>
    <label class="form-label">Mobile No </label>
    <input type="text" id="inputMob" class="form-control">
    </div>
    <div>
    <label class="form-label">Email</label>
    <input type="email" id="inputEmail" class="form-control">
    </div>
    <input onclick="insertTable()"  type="button" value="save">
    </div>
    </div>
    <table border="1">
        <thead id='thead'>
            <tr>
                <th>Roll no </th>
                <th>Name</th>
                <th>Marks</th>
                <th>Mobile No </th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody id='tbody'>

        </tbody>
        <tfoot>
            <tr>
                <td colspan="4">Total</td>
                <td id='totalMarks'> 0 </td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
