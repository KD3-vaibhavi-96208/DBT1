<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="Dom.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
<div class="container">
    <button onclick="getData()" class="btn btn-primary m-2">Get All Users</button>
    <hr>
    <table class="table">
        <thead id='thead'>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
                
            </tr>
        </thead>
        <tbody id='tbody'>

        </tbody>
    </table>
    <script>
        function display(products){
            const tbody=document.getElementById('tbody')
            console.log(products)
            tbody.innerHTML=''
            for(let e of products){
            const row=`<tr>
                <td>${e.id}</td>
                <td>${e.name}</td>
                <td>${e.price}</td>
                </tr>`
             tbody.innerHTML += row
            }
        }
        function getData(){
              fetch('./Book.json')
              .
              then((response) => {
                return response.json()
              })
              .then((products) => {
                display(products)
              })
              .catch((error) => {
                console.log(error)
              })
           }
       
    </script>
</body>
</html>
